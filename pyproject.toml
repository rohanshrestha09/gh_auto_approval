[project]
name = "gh-auto-approval"
version = "0.1.0"
description = ""
authors = [
    {name = "Rohan Shrestha",email = "rohanshrestha.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.127.0,<0.128.0)",
    "slack-bolt (>=1.27.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
]

[project.scripts]
app = "src.gh_auto_approval.main:app"

[tool.poetry]
packages = [{include = "gh_auto_approval", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

